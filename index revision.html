    <p class="hint" style="text-align:center; margin: -6px 0 18px;">Chaque tableau ne fait changer qu'UNE seule ligne (en grisé : les lignes inchangées). La correction se base sur TES propres réponses précédentes, pas sur une grille figée : si tu écris un résultat, il sert de point de départ pour le tableau suivant, même s'il est faux — une seule erreur ne fera donc rouge qu'une fois, à l'endroit où elle apparaît vraiment. Les résultats peuvent être des fractions : écris-les sous la forme 3/5 ou -1/10.</p>

      <ul>

      <div class="eqline">Assets = Liabilities + Owners' equity</div>

      <div class="eqline">Ending retained earnings = Beginning retained earnings + Net income − Dividends</div>
      <div class="eqline">Net sales = Sales − Sales returns and allowances (− discounts)</div>
      <div class="eqline">Gross profit = Net sales − Cost of goods sold</div>
      <div class="eqline">Supplies expense = Beginning supplies + Purchases − Supplies on hand</div>
      <div class="eqline">Prepaid expense used = Total paid ÷ number of months × months elapsed</div>
      <div class="eqline">Accrued interest = Principal × Annual rate × (months ÷ 12)</div>
      <div class="eqline">Straight-line depreciation = (Cost − Salvage value) ÷ Useful life</div>
      <div class="eqline">Average cost per unit = Total cost of goods available ÷ Units available</div>

<li>Formule : <span class="k">≤ 8 192 caractères</span> ; commence par <code>=</code> (ou <code>+</code> / <code>−</code>) ; évaluée à la touche Entrée ; recalculée quand une cellule citée change.</li>
<li><span class="k">+ de 500 fonctions</span>, 12 catégories : Math &amp; Trigo (SUM, ROUND, INT) · Statistique (AVERAGE, MEDIAN) · Logique (IF, AND, OR, NOT, IFERROR) · Texte (LEFT, RIGHT, TEXT) · Recherche (VLOOKUP, XLOOKUP, INDEX, MATCH) · Date &amp; heure (TODAY, NOW, DATEDIF, EOMONTH) · Financier (PMT, NPV, IRR) · Ingénierie · Information (ISNUMBER, ISERROR) · Base de données (DSUM) · Matrices dynamiques (FILTER, SORT, UNIQUE, SEQUENCE) · Web · Lambda (LAMBDA, LET).</li>
<li>Paramètres séparés par <code>;</code> (Excel FR) ou <code>,</code> (Excel EN) : l'info-bulle l'indique. <code>[crochets]</code> = paramètre optionnel ; <code>…</code> = nombre variable de paramètres (SUM). Les fonctions peuvent s'écrire en minuscules.</li>
<li><span class="k">Spill</span> : une formule peut renvoyer plusieurs résultats qui « débordent » sur les cellules voisines.</li>
</ul></div>

<div class="b"><h2>Références de cellules : $ et F4</h2>
<table class="t"><tr><th>Écriture</th><th>Nom</th><th>À la copie</th></tr>
<tr><td><code>A1</code></td><td>relative</td><td>ligne et colonne bougent</td></tr>
<tr><td><code>$A$1</code></td><td>absolue</td><td>ne bouge jamais</td></tr>
<tr><td><code>A$1</code></td><td>mixte</td><td>ligne figée, colonne bouge</td></tr>
<tr><td><code>$A1</code></td><td>mixte</td><td>colonne figée, ligne bouge</td></tr></table>
<p><span class="k">F4</span> fait défiler A1 → $A$1 → A$1 → $A1.</p>
<p>Copier une formule déplace chaque référence relative du <span class="k">même décalage</span> : <code>D6</code> copiée 4 lignes plus haut et 2 colonnes à gauche devient <code>B2</code> ; <code>C7</code> devient <code>A3</code>.</p>
<p><span class="k">Verrouiller</span> la cellule commune (taux, date de référence, table de barème) :</p>
<p><code>=DATEDIF(B4,$C$1,"Y")</code><br><code>=IF(B6=$A$2,<wbr>C6*$B$2,<wbr>C6*$B$3)</code></p>
<p>Style <span class="k">R1C1</span> (à activer dans les options) : <code>R1C1</code> = haut-gauche ; <code>RC1</code> = colonne 1 de la même ligne ; <code>R1C</code> = ligne 1 de la même colonne ; <code>R[-1]C[-1]</code> = une ligne au-dessus, une colonne à gauche ; <code>R[+1]C[+1]</code> = une ligne en dessous, une colonne à droite.</p></div>

<div class="b"><h2>Opérateurs</h2>
<table class="t"><tr><th>Opérateur</th><th>Rôle</th><th>Priorité</th></tr>
<tr><td><code>%</code> <code>^</code></td><td>pourcent, puissance</td><td>1 (la plus haute)</td></tr>
<tr><td><code>*</code> <code>/</code></td><td>multiplier, diviser</td><td>2</td></tr>
<tr><td><code>+</code> <code>−</code></td><td>additionner, soustraire</td><td>3</td></tr></table>
<p><code>=A1+B1/C1</code> divise B1 par C1 <span class="k">puis</span> ajoute A1. Pour additionner d'abord : <code>=(A1+B1)/C1</code>. En cas de doute : parenthèses (évaluées en premier, de gauche à droite).</p>
<p><span class="k">Comparaison</span> (résultat TRUE / FALSE) : <code>=</code> égal · <code>&gt;</code> · <code>&lt;</code> · <code>&gt;=</code> · <code>&lt;=</code> · <code>&lt;&gt;</code> différent.</p>
<p><span class="k">Concaténation</span> <code>&amp;</code> : <code>=A1&amp;" "&amp;B1</code> (prénom, espace, nom).</p></div>

<div class="b"><h2>Fonctions mathématiques et statistiques</h2>
<table class="t"><tr><th>Fonction</th><th>Résultat</th></tr>
<tr><td><code>SUM(…)</code> <code>PRODUCT(…)</code></td><td>somme · produit d'une liste</td></tr>
<tr><td><code>POWER(x,n)</code> <code>SQRT(x)</code></td><td>x puissance n · racine carrée</td></tr>
<tr><td><code>QUOTIENT(a,b)</code></td><td>partie <span class="k">entière</span> de a/b</td></tr>
<tr><td><code>MOD(a,b)</code></td><td>reste de la division</td></tr>
<tr><td><code>AVERAGE</code> <code>MEDIAN</code> <code>MIN</code> <code>MAX</code> <code>ABS</code></td><td>moyenne · médiane · min · max · valeur absolue</td></tr></table>
<p class="k">Arrondis</p>
<table class="t"><tr><td><code>ROUND(x,n)</code></td><td>arrondi au plus proche : n=2 centimes, n=0 entier, n=−1 dizaines</td></tr>
<tr><td><code>ROUNDUP(x,n)</code></td><td>toujours vers le haut (loin de 0)</td></tr>
<tr><td><code>ROUNDDOWN(x,n)</code></td><td>toujours vers le bas (vers 0)</td></tr>
<tr><td><code>INT(x)</code></td><td>entier inférieur (INT(−2,3) = −3)</td></tr>
<tr><td><code>TRUNC(x,n)</code></td><td>coupe les décimales sans arrondir</td></tr></table></div>

<div class="b"><h2>Compter les cellules</h2>
<table class="t"><tr><td><code>COUNT(A1:A10)</code></td><td>cellules contenant un <span class="k">nombre</span> (les dates comptent : ce sont des nombres)</td></tr>
<tr><td><code>COUNTA(A1:A10)</code></td><td>cellules <span class="k">non vides</span> (texte, nombre, erreur…)</td></tr>
<tr><td><code>COUNTBLANK(A1:A10)</code></td><td>cellules <span class="k">vides</span></td></tr></table></div>

<div class="b"><h2>Recalcul et options</h2>
<ul>
<li><span class="k">Automatic</span> : tout est recalculé dès qu'une donnée change. <span class="k">Partial</span> : idem sauf certains objets, notamment les <span class="k">tableaux croisés dynamiques</span> (à actualiser). <span class="k">Manual</span> : seulement sur demande.</li>
<li>Formulas &gt; Calculation Options. <span class="k">Calculate Now</span> (F9) = tout le classeur ; <span class="k">Calculate Sheet</span> (Maj+F9) = la feuille.</li>
</ul></div>

<div class="b"><h2>Erreurs : que signalent-elles ?</h2>
<table class="t"><tr><td><code>#DIV/0!</code></td><td>division par zéro (ou par une cellule vide)</td></tr>
<tr><td><code>#N/A</code></td><td>valeur introuvable (VLOOKUP, MATCH) ; aucun test vrai dans IFS</td></tr>
<tr><td><code>#NAME?</code></td><td>fonction ou nom inconnu ; texte sans guillemets</td></tr>
<tr><td><code>#REF!</code></td><td>référence supprimée</td></tr>
<tr><td><code>#VALUE!</code></td><td>mauvais type (texte au lieu d'un nombre)</td></tr>
<tr><td><code>#NUM!</code></td><td>nombre invalide pour la fonction</td></tr>
<tr><td><code>####</code></td><td>colonne trop étroite pour afficher le résultat</td></tr></table></div>

<div class="b"><h2>Pièges de QCM</h2>
<ul>
<li><code>SUM(A1:B1)</code> est correct (le <code>:</code> désigne une plage) ; <code>SUM(A1.B1)</code> et <code>SUM(A1&lt;B1)</code> ne le sont pas.</li>
<li>Test de réussite avec seuil 10 inclus : <code>=IF(A1&gt;=10,<wbr>"Pass",<wbr>"Fail")</code> (et non <code>&gt;10</code> ni <code>=10</code>).</li>
<li>Une formule copiée avec une référence non verrouillée « glisse » : c'est l'erreur classique à reconnaître.</li>
</ul></div>
</div></section>
<section class="fsec" data-f="2"><h2 class="fh">Fiche 2 · Dates, heures et texte <span class="fs">Session 2</span></h2><div class="fgrid">
<div class="b"><h2>Comment Excel stocke les dates</h2>
<ul>
<li>Une date est un <span class="k">numéro de série</span> = nombre de jours depuis le <span class="k">01/01/1900</span>. Ex. : <code>25/10/2025</code> = <span class="k">45955</span>.</li>
<li>Jours entre deux dates = <span class="k">simple soustraction</span> ; tri chronologique = tri de nombres.</li>
<li>Pour voir le numéro : format de cellule « Nombre ».</li>
</ul>
<table class="t"><tr><th>Fonction</th><th>Rôle</th></tr>
<tr><td><code>TODAY()</code></td><td>date du jour (mise à jour à chaque recalcul)</td></tr>
<tr><td><code>YEAR(n)</code> <code>MONTH(n)</code> <code>DAY(n)</code></td><td>année · mois · jour d'un numéro de série</td></tr>
<tr><td><code>DATE(y,m,d)</code></td><td>construit une date</td></tr></table>
<p><span class="k">DATE déborde proprement</span> :<br><code>DATE(2025,14,25)</code> = 25/02/2026 · <code>DATE(2025,10,60)</code> = 29/11/2025 · <code>DATE(2025,12,50)</code> = 19/01/2026.</p></div>

<div class="b"><h2>DATEDIF, EOMONTH, jours ouvrés</h2>
<p><code>DATEDIF(début,fin,"Y")</code> années complètes · <code>"M"</code> mois · <code>"D"</code> jours (ex. âge : <code>=DATEDIF(B4,$C$1,"Y")</code>).</p>
<p><code>EOMONTH(date,n)</code> = <span class="k">fin de mois</span>, n mois plus tard (n négatif = avant) :<br>25/10/2025 → n=0 : 31/10/2025 · n=2 : 31/12/2025 · n=−2 : 31/08/2025.</p>
<table class="t fl"><tr><td><code>NETWORKDAYS(début,<wbr>fin,<wbr>[fériés])</code></td><td>nb de <span class="k">jours ouvrés</span> (samedi et dimanche exclus ; fériés = plage de dates)</td></tr>
<tr><td><code>NETWORKDAYS.INTL(début,<wbr>fin,<wbr>[week-end],<wbr>[fériés])</code></td><td>idem, week-end au choix</td></tr>
<tr><td><code>WORKDAY(début,<wbr>jours,<wbr>[fériés])</code></td><td>date obtenue après n jours ouvrés (n négatif = avant)</td></tr>
<tr><td><code>WORKDAY.INTL(début,<wbr>jours,<wbr>[week-end],<wbr>[fériés])</code></td><td>idem, week-end au choix</td></tr></table>
<p>Week-end <code>.INTL</code> = texte de <span class="k">7 caractères</span>, lundi → dimanche : <code>0</code> = jour travaillé, <code>1</code> = jour de repos. <code>"0000011"</code> = samedi + dimanche ; <code>"0000110"</code> = vendredi + samedi.</p></div>

<div class="b"><h2>WEEKDAY(date,[type])</h2>
<table class="t"><tr><th>Type</th><th>Numérotation</th></tr>
<tr><td><code>1</code> (défaut)</td><td>1 = dimanche … 7 = samedi</td></tr>
<tr><td><code>2</code></td><td>1 = lundi … 7 = dimanche</td></tr>
<tr><td><code>3</code></td><td>0 = lundi … 6 = dimanche</td></tr>
<tr><td><code>11</code></td><td>1 = lundi … 7 = dimanche (comme 2)</td></tr>
<tr><td><code>12 à 17</code></td><td>semaine commençant mardi (12), mercredi (13) … dimanche (17)</td></tr></table></div>

<div class="b"><h2>TEXT(valeur, format)</h2>
<table class="t"><tr><th>Format</th><th>Sens</th><th>Ex.</th></tr>
<tr><td><code>d</code> · <code>dd</code></td><td>jour · sur 2 chiffres</td><td>9 · 09</td></tr>
<tr><td><code>ddd</code> · <code>dddd</code></td><td>jour court · complet</td><td>Thu · Thursday</td></tr>
<tr><td><code>m</code> · <code>mm</code></td><td>mois (nombre)</td><td>10 · 10</td></tr>
<tr><td><code>mmm</code> · <code>mmmm</code></td><td>mois court · complet</td><td>Oct · October</td></tr>
<tr><td><code>yy</code> · <code>yyyy</code></td><td>année sur 2 · 4 chiffres</td><td>25 · 2025</td></tr>
<tr><td><code>h</code> · <code>hh</code></td><td>heures</td><td>9 · 09</td></tr>
<tr><td><code>mm</code> (après h)</td><td>minutes</td><td>05</td></tr>
<tr><td><code>ss</code> · <code>AM/PM</code></td><td>secondes · 12 h</td><td>07 · 9:30 AM</td></tr></table>
<p class="w"><span class="k">Excel FR</span> : <code>d</code> devient <code>j</code> et <code>y</code> devient <code>a</code> (ex. <code>"jj/mm/aaaa"</code>). <code>TEXT</code> renvoie du <span class="k">texte</span> (plus un nombre).</p></div>

<div class="b"><h2>L'heure = fraction de jour</h2>
<table class="t"><tr><th>Saisie</th><th>Valeur stockée</th></tr>
<tr><td>06:00</td><td>0,25 (25 % d'un jour)</td></tr>
<tr><td>12:00</td><td>0,5</td></tr>
<tr><td>18:00</td><td>0,75</td></tr>
<tr><td>24:00</td><td>1</td></tr>
<tr><td>36:00</td><td>1,5 (1 jour + 50 %)</td></tr></table>
<ul>
<li><span class="k">Durée</span> entre deux heures = fin − début ; <span class="k">cumul</span> = addition.</li>
<li>Pour voir la fraction : format « Nombre ». Pour cumuler plus de 24 h : format <code>[h]:mm</code>.</li>
<li><code>NOW()</code> = date <span class="k">et</span> heure actuelles (recalculé). <code>TIME(h,m,s)</code> : h modulo 24 ; minutes et secondes qui dépassent 59 débordent sur l'unité suivante. <code>HOUR</code> · <code>MINUTE</code> · <code>SECOND</code> extraient une partie.</li>
</ul></div>

<div class="b"><h2>Fonctions de texte</h2>
<table class="t fl">
<tr><td><code>LEFT(t,n)</code> <code>RIGHT(t,n)</code></td><td>n premiers · n derniers caractères</td></tr>
<tr><td><code>MID(t,début,n)</code></td><td>n caractères à partir de la position début</td></tr>
<tr><td><code>LEN(t)</code></td><td>longueur (espaces compris)</td></tr>
<tr><td><code>FIND(cherché,<wbr>t,<wbr>[début])</code></td><td>position ; <span class="k">sensible à la casse</span>, sans jokers</td></tr>
<tr><td><code>SEARCH(cherché,<wbr>t,<wbr>[début])</code></td><td>position ; <span class="k">insensible à la casse</span>, jokers <code>*</code> <code>?</code></td></tr>
<tr><td><code>SUBSTITUTE(t,<wbr>ancien,<wbr>nouveau,<wbr>[n°])</code></td><td>remplace du <span class="k">texte</span> (la n-ième occurrence si n° donné)</td></tr>
<tr><td><code>REPLACE(t,<wbr>début,<wbr>n,<wbr>nouveau)</code></td><td>remplace n caractères à partir d'une <span class="k">position</span></td></tr>
<tr><td><code>TRIM(t)</code></td><td>supprime les espaces en trop</td></tr>
<tr><td><code>UPPER</code> <code>LOWER</code> <code>PROPER</code></td><td>MAJUSCULES · minuscules · Initiales Majuscules</td></tr>
<tr><td><code>CONCAT</code> <code>CONCATENATE</code> <code>&amp;</code></td><td>assemble des textes</td></tr>
<tr><td><code>TEXTJOIN(sép,<wbr>ignorer_vides,<wbr>t1,<wbr>…)</code></td><td>assemble avec un séparateur</td></tr>
<tr><td><code>REPT(t,n)</code></td><td>répète le texte n fois</td></tr>
<tr><td><code>VALUE(t)</code></td><td>texte → nombre</td></tr>
<tr><td><code>EXACT(a,b)</code></td><td>TRUE si identiques (casse comprise)</td></tr>
<tr><td><code>CHAR(n)</code> <code>CODE(t)</code></td><td>caractère du code n · code du 1<sup>er</sup> caractère</td></tr>
<tr><td><code>FIXED(x,<wbr>déc,<wbr>[sans_sép])</code></td><td>nombre arrondi mis en texte</td></tr></table>
<p>Ex. : nom de famille après l'espace : <code>=MID(A2,FIND(" ",A2)+1,LEN(A2))</code></p></div>
</div></section>
<section class="fsec" data-f="3"><h2 class="fh">Fiche 3 · Logique et conditionnel <span class="fs">Session 3</span></h2><div class="fgrid">
<div class="b"><h2>IF et conditions imbriquées</h2>
<p><code>IF(condition, si vrai, si faux)</code></p>
<p>Salaire selon la catégorie (barème en <code>$A$2:$B$3</code>) :<br><code>=IF(B6=$A$2,<wbr>C6*$B$2,<wbr>C6*$B$3)</code></p>
<p><span class="k">IF imbriqué</span> (on teste dans l'ordre, du plus petit seuil au plus grand) :<br><code>=IF(B2&lt;1000,<wbr>0%,<wbr>IF(B2&lt;10000,<wbr>10%,<wbr>20%))</code><br>puis prix final : <code>=B5*(1-B6)</code></p>
<p><code>=IF(B2&lt;60,<wbr>"F",<wbr>IF(B2&lt;70,<wbr>"D",<wbr>IF(B2&lt;80,<wbr>"C",<wbr>IF(B2&lt;90,<wbr>"B",<wbr>"A"))))</code></p>
<p><span class="k">IFS</span>(cond1, val1, cond2, val2, …) : la <span class="k">première</span> condition vraie arrête le test ; aucune vraie → <code>#N/A</code>. Pour un « sinon » : dernière condition <code>TRUE</code>.<br><code>=IFS(A1&gt;=90,<wbr>"A",<wbr>A1&gt;=80,<wbr>"B",<wbr>A1&gt;=70,<wbr>"C",<wbr>A1&gt;=60,<wbr>"D",<wbr>TRUE,<wbr>"F")</code></p></div>

<div class="b"><h2>AND, OR, NOT, tests d'information, IFERROR</h2>
<ul>
<li><code>AND(c1,c2,…)</code> vrai si <span class="k">toutes</span> vraies · <code>OR(c1,c2,…)</code> vrai si <span class="k">au moins une</span> · <code>NOT(c)</code> inverse : <code>=NOT(E5=10)</code>.</li>
<li>Exemple : <code>=IF(AND(B2&gt;=18,<wbr>C2="Oui"),<wbr>"OK",<wbr>"Non")</code></li>
</ul>
<table class="t"><tr><td><code>ISBLANK</code></td><td>cellule vide</td><td><code>ISNUMBER</code></td><td>nombre</td></tr>
<tr><td><code>ISTEXT</code></td><td>texte</td><td><code>ISNONTEXT</code></td><td>non texte</td></tr>
<tr><td><code>ISLOGICAL</code></td><td>TRUE / FALSE</td><td><code>ISERROR</code></td><td>toute erreur</td></tr>
<tr><td><code>ISERR</code></td><td>erreur sauf #N/A</td><td><code>ISNA</code></td><td>erreur #N/A</td></tr>
<tr><td><code>ISEVEN</code></td><td>nombre pair</td><td><code>ISODD</code></td><td>nombre impair</td></tr></table>
<p><code>IFERROR(valeur, si erreur)</code> : <code>=IFERROR(VLOOKUP(A2,<wbr>T,<wbr>2,<wbr>FALSE),<wbr>"Inconnu")</code></p></div>

<div class="b"><h2>Compter, additionner, moyenner sous condition</h2>
<table class="t fl">
<tr><td><code>COUNTIF</code></td><td><code>(plage, critère)</code></td></tr>
<tr><td><code>COUNTIFS</code></td><td><code>(plage1, critère1, plage2, critère2, …)</code> : <span class="k">ET</span> entre les critères</td></tr>
<tr><td><code>SUMIF</code></td><td><code>(plage_critère, critère, [plage_somme])</code></td></tr>
<tr><td><code>SUMIFS</code></td><td><code>(plage_somme, plage1, critère1, …)</code></td></tr>
<tr><td><code>AVERAGEIF</code></td><td><code>(plage_critère, critère, [plage_moyenne])</code></td></tr>
<tr><td><code>AVERAGEIFS</code></td><td><code>(plage_moyenne, plage1, critère1, …)</code></td></tr>
<tr><td><code>MAXIFS</code> <code>MINIFS</code></td><td><code>(plage_résultat, plage1, critère1, …)</code> : plus grande · plus petite valeur sous condition</td></tr></table>
<p class="w"><span class="k">Piège d'ordre</span> : avec les fonctions en <span class="k">S</span> (SUMIFS, AVERAGEIFS, MAXIFS, MINIFS) la plage à calculer vient en <span class="k">premier</span> ; avec SUMIF et AVERAGEIF elle vient en <span class="k">dernier</span>. COUNTIFS n'a pas de plage de calcul.</p>
<p><span class="k">Critères</span> : un nombre <code>20</code> (égal) · <code>"&lt;20"</code> · <code>"&gt;=50"</code> · <code>"&lt;&gt;10"</code> (différent) · du texte <code>"F"</code> · jokers <code>"A*"</code> (commence par A), <code>"?"</code> (1 caractère) · avec une cellule : <code>"&gt;"&amp;B1</code>. Opérateur et nombre toujours entre guillemets.</p>
<p><code>=SUMIF(A2:A15,<wbr>"F",<wbr>C2:C15)</code> · <code>=SUMIF(C2:C15,<wbr>"&gt;30000")</code><br><code>=AVERAGEIF(A2:A15,<wbr>"F",<wbr>C2:C15)</code> · <code>=AVERAGEIF(C2:C15,<wbr>"&gt;30000")</code><br><code>=COUNTIF(A1:A100,20)</code> · <code>=COUNTIF(A1:A100,<wbr>"&lt;20")</code><br><code>=COUNTIFS(A1:A10,<wbr>"&lt;&gt;10",<wbr>A1:A10,<wbr>"&lt;&gt;20")</code><br><code>=SUMIFS(C2:C15,<wbr>A2:A15,<wbr>"M",<wbr>B2:B15,<wbr>"&gt;50")</code><br><code>=AVERAGEIFS(C2:C15,<wbr>A2:A15,<wbr>"F",<wbr>B2:B15,<wbr>"&lt;40")</code></p></div>

<div class="b"><h2>Mise en forme conditionnelle (Home &gt; Conditional Formatting)</h2>
<table class="t"><tr><th>Famille</th><th>Contenu</th></tr>
<tr><td><span class="k">Highlight Cells Rules</span></td><td>supérieur à, inférieur à, entre, égal à, texte contenant, date, valeurs <span class="k">en double</span></td></tr>
<tr><td><span class="k">Top/Bottom Rules</span></td><td>10 premiers / derniers éléments ou %, <span class="k">au-dessus / en dessous de la moyenne</span></td></tr>
<tr><td><span class="k">Data Bars</span></td><td>barres proportionnelles à la valeur</td></tr>
<tr><td><span class="k">Color Scales</span></td><td>dégradé de 2 ou 3 couleurs selon la valeur</td></tr>
<tr><td><span class="k">Icon Sets</span></td><td>icônes (flèches, feux, étoiles) selon des seuils</td></tr></table>
<p><span class="k">Règle personnalisée</span> (New Rule) : formater toutes les cellules selon leurs valeurs · seulement les cellules qui contiennent · seulement les valeurs classées en haut / en bas · au-dessus ou en dessous de la moyenne · valeurs uniques ou en double · <span class="k">utiliser une formule</span>.</p>
<ul>
<li>Règle à formule : écrite pour la <span class="k">première cellule</span> de la plage sélectionnée, résultat TRUE / FALSE, références <span class="k">mixtes</span>.</li>
<li>Colorer toute la ligne si la colonne C dépasse 1000 : sélectionner <code>A2:F20</code>, formule <code>=$C2&gt;1000</code> (colonne verrouillée, ligne libre).</li>
<li>Manage Rules : ordre de priorité, plage d'application, supprimer ; la mise en forme suit les données si elles changent.</li>
</ul></div>
</div></section>
<section class="fsec" data-f="4"><h2 class="fh">Fiche 4 · Recherche, tableaux et TCD <span class="fs">Sessions 4 et 5</span></h2><div class="fgrid">
<div class="b"><h2>INDEX et MATCH / XMATCH</h2>
<p><code>INDEX(plage, ligne, [colonne])</code> renvoie la valeur à une position :<br><code>=INDEX(C9:C19,G1)</code> (colonne) · <code>=INDEX(C9:H9,D1)</code> (ligne) · <code>=INDEX(C9:H19,G1,D1)</code> (intersection ligne G1, colonne D1).</p>
<p><code>MATCH(cherché, plage_1D, [type])</code> renvoie la <span class="k">position</span> :</p>
<table class="t"><tr><th>Type</th><th>Comportement</th><th>Tri</th></tr>
<tr><td><code>0</code></td><td>valeur exacte, sinon #N/A</td><td>non</td></tr>
<tr><td><code>1</code></td><td>exacte, sinon la plus grande valeur <span class="k">≤</span></td><td>croissant</td></tr>
<tr><td><code>−1</code></td><td>exacte, sinon la plus petite valeur <span class="k">≥</span></td><td>décroissant</td></tr></table>
<p><code>XMATCH(cherché, plage, [mode], [sens])</code> : mode <code>0</code> exact (défaut) · <code>−1</code> exact ou le plus petit suivant · <code>1</code> exact ou le plus grand suivant · <code>2</code> jokers <code>*</code> <code>?</code> ; sens <code>1</code> premier→dernier (défaut) · <code>−1</code> dernier→premier · <code>2</code> / <code>−2</code> recherche binaire (trié croissant / décroissant).</p></div>

<div class="b"><h2>VLOOKUP et HLOOKUP</h2>
<p><code>VLOOKUP(cherché, table, n°_colonne, [approx])</code></p>
<ul>
<li>Cherche dans la <span class="k">1<sup>re</sup> colonne</span> de la table, renvoie la colonne n° (compté <span class="k">depuis la 1<sup>re</sup> colonne de la table</span>). Tableau vertical.</li>
<li><code>FALSE</code> / <code>0</code> = <span class="k">exact</span> (table non triée ; sinon #N/A).</li>
<li><code>TRUE</code> / <code>1</code> = <span class="k">approximatif</span>, <span class="k">valeur par défaut si omis</span> : première colonne <span class="k">triée en ordre croissant</span> ; renvoie la ligne de la plus grande valeur ≤ cherché ; sinon #N/A. Idéal pour les barèmes (remises, tranches, notes).</li>
</ul>
<p><code>=VLOOKUP(B3,<wbr>A2:E21,<wbr>3,<wbr>FALSE)</code><br><code>=VLOOKUP(E2,<wbr>$A$13:$B$16,<wbr>2,<wbr>TRUE)</code> (table <span class="k">verrouillée</span> car formule recopiée)</p>
<p><code>HLOOKUP</code> : même comportement, table <span class="k">horizontale</span> (clés sur la 1<sup>re</sup> ligne).</p></div>

<div class="b"><h2>XLOOKUP et INDEX/MATCH</h2>
<p><code>XLOOKUP(cherché, plage_recherche, plage_résultat, [si_absent], [mode], [sens])</code></p>
<ul>
<li>Remplace VLOOKUP, HLOOKUP, LOOKUP ; peut chercher <span class="k">à gauche</span> du résultat ; verticale ou horizontale.</li>
<li><code>si_absent</code> : valeur renvoyée sinon (<span class="k">sans lui : #N/A</span>). Modes et sens identiques à XMATCH (exact par défaut, 0).</li>
</ul>
<p><code>=INDEX(plage_résultat, MATCH(cherché, plage_recherche, 0))</code> : cherche dans <span class="k">n'importe quelle colonne</span>, renvoie une autre colonne (ancienne alternative à XLOOKUP).</p>
<table class="t"><tr><th></th><th>VLOOKUP</th><th>INDEX/MATCH · XLOOKUP</th></tr>
<tr><td>Sens</td><td>colonne de clé = 1<sup>re</sup>, résultat à droite</td><td>libre (gauche ou droite)</td></tr>
<tr><td>Approximatif</td><td>plus petit seulement</td><td>aussi « plus grand suivant »</td></tr></table></div>

<div class="b"><h2>Tableaux Excel (Insert &gt; Table, <span class="c">Ctrl+T</span>)</h2>
<ul>
<li>Plage de données devenue <span class="k">objet géré</span> : en-têtes, filtres automatiques, <span class="k">extension automatique</span> aux nouvelles lignes, colonnes calculées recopiées, <span class="k">Total Row</span> (liste Sum, Average, Count, Min, Max).</li>
<li>Nommer le tableau (Table Design) : sans espace, ex. <code>SalesTable</code>.</li>
</ul>
<table class="t"><tr><th>Zone / usage</th><th>Écriture</th></tr>
<tr><td>Une colonne</td><td><code>SalesTable[Total]</code></td></tr>
<tr><td>Ligne courante</td><td><code>[@Quantity]</code> ou <code>#This Row</code></td></tr>
<tr><td>Calcul ligne</td><td><code>=[@Quantity]*[@[Unit Price]]</code></td></tr>
<tr><td>Somme d'une colonne</td><td><code>=SUM(SalesTable[Total])</code> (inclut les futures lignes)</td></tr>
<tr><td>En-têtes · données</td><td><code>#Headers</code> · <code>#Data</code></td></tr>
<tr><td>Ligne de totaux · tout</td><td><code>#Totals</code> · <code>#All</code></td></tr>
<tr><td>Cellule d'en-tête</td><td><code>SalesTable[[#Headers],<wbr>[Total]]</code></td></tr>
<tr><td>Colonnes voisines</td><td><code>SalesTable[[Quantity]:[Total]]</code></td></tr></table>
<p>Nom de colonne avec espace ou caractère spécial : doubles crochets <code>[@[Unit Price]]</code>. Hors tableau, citer le nom du tableau ; dans le tableau, <code>@</code> suffit.</p></div>

<div class="b"><h2>Trier et filtrer</h2>
<ul>
<li>Data &gt; <span class="k">Sort</span> : plusieurs niveaux (colonne, critère, ordre) ; trier une colonne <span class="k">seule</span> dissocie les lignes : sélectionner toute la plage ou le tableau.</li>
<li>Data &gt; <span class="k">Filter</span> : filtres texte (commence par, contient), nombre (supérieur à, 10 premiers, au-dessus de la moyenne) et date ; <span class="k">masque</span> les lignes sans les supprimer ; <span class="k">Clear</span> pour les réafficher.</li>
</ul></div>

<div class="b"><h2>Tableau croisé dynamique (Insert &gt; PivotTable)</h2>
<ul>
<li>Zones : <span class="k">Rows</span> · <span class="k">Columns</span> · <span class="k">Values</span> (Sum, Count, Average…) · <span class="k">Filters</span> (filtre de rapport). Nommer le TCD (PivotTable Analyze) : « PT1.1 ».</li>
<li><span class="k">Ne se recalcule pas seul</span> : Refresh (<span class="c">Alt+F5</span>) après changement des données.</li>
<li>Value Field Settings : Sum / <span class="k">Count</span> / Average ; <span class="k">Show Values As</span> : % du total de la colonne, de la ligne, du total général.</li>
<li><span class="k">Group</span> : nombres (début, fin, <span class="k">par</span> pas : minutes par 15 ; montants par 2 000) ; dates (années, trimestres, mois).</li>
<li>Filtres : <span class="k">Label Filters</span> (commence par « A ») · <span class="k">Value Filters</span> (supérieur à 50) · filtre de rapport (own_goal = No).</li>
<li><span class="k">Slicer</span> (PivotTable Analyze &gt; Insert Slicer) : boutons de filtre sur un champ. <span class="k">Timeline</span> : filtre sur un champ <span class="k">date</span> (années, trimestres, mois).</li>
</ul>
<table class="t"><tr><th>Cas des exercices</th><th>Montage</th></tr>
<tr><td>Buts par équipe, penalties séparés</td><td>Rows : équipe · Columns : penalty · Values : <span class="k">Count</span> de player's name · filtre own_goal = No · Value Filter &gt; 50 (sur le total)</td></tr>
<tr><td>Quand marque-t-on ? (équipes en « A »)</td><td>Rows : minute, Group par 15 · Columns : équipe (Label Filter commence par A) · Values : Count, % du total de la colonne</td></tr>
<tr><td>Buts par joueur (&gt; 8)</td><td>Rows : joueur · Columns : penalty · Count de minute · filtre own_goal = No · Value Filter &gt; 8</td></tr>
<tr><td>Somme et moyenne des ventes</td><td>Rows : région · Columns : catégorie, puis sous-catégorie (bouton +) · Values : Sum puis Average of Sales (2 champs ; « Σ Values » placé en lignes)</td></tr>
<tr><td>Ventes par ville et catégorie (ou segment) + 2 slicers</td><td>Rows : City · Columns : le champ demandé (Segment sur la capture du cours ; Category selon l'énoncé) · Values : Sum of Sales · 2 slicers (City, Segment)</td></tr>
<tr><td>Répartition des montants</td><td>Rows : segment, montant groupé par 2 000 · Columns : catégorie · Values : Count of Customer Name</td></tr>
<tr><td>Ventes par année + timeline + slicer</td><td>Rows : Order Date (années) · Columns : catégorie · Sum of Sales · Insert Timeline : Order Date · Slicer : Category</td></tr></table></div>

<div class="b"><h2>Raccourcis utiles</h2>
<p><code>F4</code> basculer $ · <code>F2</code> modifier la cellule · <code>Ctrl+T</code> créer un tableau · <code>Alt+F5</code> actualiser un TCD · <code>F9</code> recalculer · <code>Ctrl+;</code> date du jour · <code>Ctrl+Shift+;</code> heure · <code>Ctrl+D</code> recopier vers le bas · <code>Ctrl+Z</code> annuler · poignée de recopie : double-clic pour tirer la formule jusqu'au bas des données.</p></div>
</div></section>

<script>

const APPS = {};
APPS.matrices = [function(document){

(function(){
  const VARS3 = ['x','y','z'];
  const COEFF_POOL = [-5,-4,-3,-3,-2,-2,-1,-1,-1,0,0,0,1,1,1,2,2,3,3,4,5];
  const ARROW = '\u2190';

  function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pickCoeff(){ return COEFF_POOL[randInt(0, COEFF_POOL.length - 1)]; }
  function fmtNum(n){ return n < 0 ? '\u2212' + Math.abs(n) : String(n); }

  function setGridTemplate(el, n, showB){
    el.style.gridTemplateColumns = 'auto ' + 'repeat(' + n + ', 54px)' + (showB ? ' 54px' : '');
  }

  function makeInputCell(type, row, col, isB, onEnter, allowSlash, onLiveChange){
    const cell = document.createElement('div');
    cell.className = 'cell' + (isB ? ' b-cell' : '');
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = allowSlash ? 'text' : 'numeric';
    input.autocomplete = 'off';
    input.maxLength = allowSlash ? 8 : 4;
    if (allowSlash) input.classList.add('frac-input');
    input.dataset.type = type;
    input.dataset.row = row;
    input.dataset.col = col;
    input.setAttribute('aria-label', isB
      ? ('Ligne ' + (row + 1) + ', second membre')
      : ('Ligne ' + (row + 1) + ', colonne ' + (col + 1)));
    input.addEventListener('input', () => {
      const re = allowSlash ? /[^0-9\/.,\u2212-]/g : /[^0-9\u2212-]/g;
      input.value = input.value.replace(re, '');
      input.classList.remove('correct', 'incorrect', 'missing', 'solution');
      if (onLiveChange) onLiveChange();
    });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && onEnter) onEnter(); });
    cell.appendChild(input);
    return cell;
  }

  function makeStaticCell(value, isB){
    const cell = document.createElement('div');
    cell.className = 'cell' + (isB ? ' b-cell' : '');
    const val = document.createElement('div');
    val.className = 'static-val';
    val.textContent = value;
    cell.appendChild(val);
    return cell;
  }

  // ---------- MODE 1 : équations -> matrice ----------
  let state = { n: 2, showB: true, A: [], b: [], solved: 0, streak: 0, solutionShown: false };

  const equationsEl = document.getElementById('equations');
  const gridEl = document.getElementById('matrixGrid');
  const feedbackEl = document.getElementById('feedback');
  const statsEl = document.getElementById('stats');
  const checkBtn = document.getElementById('checkBtn');
  const solutionBtn = document.getElementById('solutionBtn');
  const showBToggle = document.getElementById('showB');

  function generateRow(n){
    let row;
    do { row = []; for (let j = 0; j < n; j++) row.push(pickCoeff()); }
    while (row.every(c => c === 0));
    return row;
  }

  function generateExercise(n){
    const A = [], b = [];
    for (let i = 0; i < n; i++){ A.push(generateRow(n)); b.push(randInt(-15, 15)); }
    state.n = n; state.A = A; state.b = b; state.solutionShown = false;
    renderWrite();
  }

  function formatEquation(coeffs, vars, rhs){
    const parts = [];
    coeffs.forEach((c, i) => {
      if (c === 0) return;
      const v = vars[i];
      const abs = Math.abs(c);
      const numStr = abs === 1 ? '' : String(abs);
      if (parts.length === 0) parts.push((c < 0 ? '\u2212' : '') + numStr + v);
      else parts.push((c < 0 ? ' \u2212 ' : ' + ') + numStr + v);
    });
    if (parts.length === 0) parts.push('0');
    return parts.join('') + ' = ' + fmtNum(rhs);
  }

  function renderEquations(){
    const vars = state.n === 3 ? VARS3 : VARS3.slice(0, 2);
    equationsEl.innerHTML = '';
    for (let i = 0; i < state.n; i++){
      const row = document.createElement('div');
      row.className = 'equation-row';
      row.innerHTML = '<span class="eq-label">L' + (i + 1) + '</span><span class="eq-text">' +
        formatEquation(state.A[i], vars, state.b[i]) + '</span>';
      equationsEl.appendChild(row);
    }
  }

  function renderMatrixGrid(){
    const n = state.n, showB = state.showB;
    setGridTemplate(gridEl, n, showB);
    gridEl.innerHTML = '';
    for (let i = 0; i < n; i++){
      const label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = 'L' + (i + 1);
      gridEl.appendChild(label);
      for (let j = 0; j < n; j++) gridEl.appendChild(makeInputCell('a', i, j, false, checkAnswers, false));
      if (showB) gridEl.appendChild(makeInputCell('b', i, 0, true, checkAnswers, false));
    }
  }

  function checkAnswers(){
    if (state.solutionShown) return;
    const inputs = Array.from(gridEl.querySelectorAll('input'));
    let allFilled = true, allCorrect = true;
    inputs.forEach(input => {
      const old = input.parentElement.querySelector('.correction');
      if (old) old.remove();
      const val = input.value.trim().replace('\u2212', '-');

  // ---------- Fractions (exact arithmetic) ----------
  function gcd(a, b){ a = Math.abs(a); b = Math.abs(b); while (b){ const t = b; b = a % b; a = t; } return a || 1; }
  function Frac(n, d){
    if (d === undefined) d = 1;
    if (d < 0){ n = -n; d = -d; }
    const g = gcd(n, d) || 1;
    this.n = n / g; this.d = d / g;
  }
  Frac.prototype.add = function(o){ return new Frac(this.n * o.d + o.n * this.d, this.d * o.d); };
  Frac.prototype.sub = function(o){ return new Frac(this.n * o.d - o.n * this.d, this.d * o.d); };
  Frac.prototype.mul = function(o){ return new Frac(this.n * o.n, this.d * o.d); };
  Frac.prototype.div = function(o){ return new Frac(this.n * o.d, this.d * o.n); };
  Frac.prototype.neg = function(){ return new Frac(-this.n, this.d); };
  Frac.prototype.isZero = function(){ return this.n === 0; };
  Frac.prototype.isOne = function(){ return this.n === this.d; };
  Frac.prototype.toString = function(){ return this.d === 1 ? String(this.n) : (this.n + '/' + this.d); };
  function dispFrac(f){ return f.toString().replace('-', '\u2212'); }
  function parseFrac(raw){
    if (!raw) return null;
    const s = raw.trim().replace('\u2212', '-').replace(',', '.');
    if (s === '') return null;
    if (s.includes('/')){
      const parts = s.split('/');
      if (parts.length !== 2) return null;
      const n = parseInt(parts[0], 10), d = parseInt(parts[1], 10);
      if (isNaN(n) || isNaN(d) || d === 0) return null;
      return new Frac(n, d);
    }
    if (s.includes('.')){
      const neg = s.startsWith('-');
      const abs = neg ? s.slice(1) : s;
      const parts = abs.split('.');
      if (parts.length !== 2) return null;
      const intPart = parts[0] === '' ? '0' : parts[0];
      const decPart = parts[1];
      if (!/^\d+$/.test(intPart) || !/^\d+$/.test(decPart)) return null;
      const denom = Math.pow(10, decPart.length);
      let numerator = parseInt(intPart, 10) * denom + parseInt(decPart, 10);
      if (neg) numerator = -numerator;
      return new Frac(numerator, denom);
    }
    const n = parseInt(s, 10);
    if (isNaN(n)) return null;
    return new Frac(n, 1);
  }

  function formatNormalize(pivot, rowLabel){
    const wrapped = (pivot.toString().includes('/') || pivot.n < 0) ? '(' + dispFrac(pivot) + ')' : dispFrac(pivot);
    return rowLabel + ' ' + ARROW + ' ' + rowLabel + ' / ' + wrapped;
  }
  function formatEliminate(factor, rowLabel, pivotRowLabel){
    const neg = factor.n < 0;
    const absFrac = neg ? factor.neg() : factor;
    const str = dispFrac(absFrac);
    const wrapped = str.includes('/') ? '(' + str + ')' : str;
    const sign = neg ? ' + ' : ' \u2212 ';
    return rowLabel + ' ' + ARROW + ' ' + rowLabel + sign + wrapped + '\u00b7' + pivotRowLabel;
  }

  // Builds one micro-step per SINGLE row change: never asks for a row that
  // depends on another row being computed in that same tableau.
  function eliminateMicroSteps(A, b, n){
    let M = [];
    for (let i = 0; i < n; i++){
      const row = []; for (let j = 0; j < n; j++) row.push(new Frac(A[i][j]));
      row.push(new Frac(b[i])); M.push(row);
    }
    const microSteps = [];
    for (let k = 0; k < n; k++){
      const pivot = M[k][k];
      if (pivot.isZero()) return null;
      const labelK = 'L' + (k + 1);
      if (!pivot.isOne()){
        M[k] = M[k].map(v => v.div(pivot));
        microSteps.push({ changedRow: k, isNormalize: true, pivotK: k, opLine: formatNormalize(pivot, labelK), matrix: M.map(r => r.slice()) });
      }
      for (let i = 0; i < n; i++){
        if (i === k) continue;
        const factor = M[i][k];
        if (factor.isZero()) continue;
        const labelI = 'L' + (i + 1);
        M[i] = M[i].map((v, j) => v.sub(factor.mul(M[k][j])));
        microSteps.push({ changedRow: i, isNormalize: false, pivotK: k, opLine: formatEliminate(factor, labelI, labelK), matrix: M.map(r => r.slice()) });
      }
    }
    return microSteps;
  }

  function reasonableMicroSteps(microSteps){
    for (const ms of microSteps) for (const row of ms.matrix) for (const f of row){
      if (Math.abs(f.d) > 40) return false;
      if (Math.abs(f.n) > 400) return false;
    }
    return true;
  }

  // ---------- MODE 2 : pivot de Gauss ----------
  let gstate = { n: 2, A: [], b: [], microSteps: [], solutionShown: false, solved: 0, streak: 0 };

  const solutionGaussBtn = document.getElementById('solutionGaussBtn');
  const showHintsToggle = document.getElementById('showHints');
  let stepCellRefs = [];   // per step k: { a: [input,...], b: input } for the editable row
  let staticCellRefs = []; // per step k: { rowIndex: { a: [span,...], b: span } } for the given rows

  function generateGaussExercise(n){
    let candidate = null, fallback = null, tries = 0;
    while (tries < 8000 && !candidate){
      tries++;
      const A = []; for (let i = 0; i < n; i++){ const row = []; for (let j = 0; j < n; j++) row.push(randInt(-6, 6)); A.push(row); }
      const b = []; for (let i = 0; i < n; i++) b.push(randInt(-9, 9));
      const microSteps = eliminateMicroSteps(A, b, n);
      if (!microSteps || microSteps.length === 0) continue;
      if (!fallback) fallback = { A: A, b: b, microSteps: microSteps };
      if (reasonableMicroSteps(microSteps)) candidate = { A: A, b: b, microSteps: microSteps };
    }
    const chosen = candidate || fallback;
    gstate.n = n; gstate.A = chosen.A; gstate.b = chosen.b; gstate.microSteps = chosen.microSteps; gstate.solutionShown = false;
    renderGauss();
  }

  // Rebuilds the "live" chain of matrices using the student's own entered
  // values (whatever they are) so each tableau's given rows — and the
  // expected answer for the next one — always follow from what the
  // student actually wrote, not a fixed independent answer key.
  function recomputeChain(){
    const n = gstate.n;
    let start = [];
    for (let i = 0; i < n; i++){
      const row = []; for (let j = 0; j < n; j++) row.push(new Frac(gstate.A[i][j]));
      row.push(new Frac(gstate.b[i])); start.push(row);
    }
    const liveStates = [start];
    const liveExpected = [];

    gstate.microSteps.forEach((ms, k) => {
      const stateBefore = liveStates[k];
      let expectedRow;
      if (ms.isNormalize){
        const pivotVal = stateBefore[ms.changedRow][ms.pivotK];
        expectedRow = pivotVal.isZero() ? ms.matrix[ms.changedRow].slice() : stateBefore[ms.changedRow].map(v => v.div(pivotVal));
      } else {
        const factor = stateBefore[ms.changedRow][ms.pivotK];
        const sourceRow = stateBefore[ms.pivotK];
        expectedRow = stateBefore[ms.changedRow].map((v, j) => v.sub(factor.mul(sourceRow[j])));
      }
      liveExpected.push(expectedRow);

      let userRow = null;
      const refs = stepCellRefs[k];
      if (refs){
        const vals = [];
        let ok = true;
        refs.a.forEach(inp => { const p = parseFrac(inp.value); if (!p) ok = false; else vals.push(p); });
        const pb = parseFrac(refs.b.value);
        if (!pb) ok = false; else vals.push(pb);
        if (ok && vals.length === n + 1) userRow = vals;
      }
      const nextRow = userRow || expectedRow;

      const nextState = stateBefore.slice();
      nextState[ms.changedRow] = nextRow;
      liveStates.push(nextState);
    });

    gstate.liveStates = liveStates;
    gstate.liveExpected = liveExpected;

    gstate.microSteps.forEach((ms, k) => {
      const stateBefore = liveStates[k];
      const refsByRow = staticCellRefs[k];
      for (let i = 0; i < n; i++){
        if (i === ms.changedRow) continue;
        const refs = refsByRow && refsByRow[i];
        if (!refs) continue;
        for (let j = 0; j < n; j++) refs.a[j].textContent = dispFrac(stateBefore[i][j]);
        refs.b.textContent = dispFrac(stateBefore[i][n]);
      }
    });
  }

  function checkGauss(){
    if (gstate.solutionShown) return;
    recomputeChain();
    const inputs = Array.from(stepsContainer.querySelectorAll('input'));
    let allFilled = true, allCorrect = true;
    inputs.forEach(input => {
      const old = input.parentElement.querySelector('.correction'); if (old) old.remove();
      const k = Number(input.dataset.step);
      const col = input.dataset.type === 'a' ? Number(input.dataset.col) : gstate.n;
      const expected = gstate.liveExpected[k][col];
      const raw = input.value.trim();
      if (raw === ''){ allFilled = false; allCorrect = false; input.classList.remove('correct','incorrect'); input.classList.add('missing'); return; }
      input.classList.remove('missing');
      const parsed = parseFrac(raw);
      if (parsed && parsed.n === expected.n && parsed.d === expected.d){ input.classList.add('correct'); input.classList.remove('incorrect'); }
      else {
        input.classList.add('incorrect'); input.classList.remove('correct'); allCorrect = false;
        const note = document.createElement('span'); note.className = 'correction'; note.textContent = dispFrac(expected);
        input.parentElement.appendChild(note);
      }
    });

    if (!allFilled){
      gaussFeedback.textContent = 'Complète toutes les cases avant de vérifier.'; gaussFeedback.className = 'feedback info';
      conclusionLine.style.display = 'none';
      return;
    }

    const lastStepIdx = gstate.microSteps.length - 1;
    const lastInputs = inputs.filter(inp => Number(inp.dataset.step) === lastStepIdx);
    const lastOk = lastInputs.every(inp => inp.classList.contains('correct'));
    if (lastOk) showConclusion(true); else conclusionLine.style.display = 'none';

    if (allCorrect){ gstate.solved++; gstate.streak++; gaussFeedback.textContent = 'Exact — chaque tableau suit correctement du précédent.'; gaussFeedback.className = 'feedback success'; }
    else { gstate.streak = 0; gaussFeedback.textContent = 'Certaines cases sont à revoir (en rouge, valeur attendue en dessous — calculée à partir de TES réponses précédentes).'; gaussFeedback.className = 'feedback error'; }
    updateGaussStats();
  }

  function showConclusion(fromLiveChain){

    const vars = n === 3 ? VARS3 : VARS3.slice(0, 2);
    const parts = vars.map((v, i) => v + ' = ' + dispFrac(M[i][n]));
    conclusionLine.textContent = 'Conclusion : ' + parts.join(', ');
    conclusionLine.style.display = 'block';
  }

  // ---------- MODE 3 : chaînes de Markov ----------
  const MARKOV_POOLS_2 = [
    { states: ["la Banque Alpha", "la Banque Beta"], short: ["Alpha", "Beta"] },
    { states: ["l'Opérateur Nord", "l'Opérateur Sud"], short: ["Nord", "Sud"] },
    { states: ["le Forfait Basique", "le Forfait Premium"], short: ["Basique", "Premium"] }
  ];
  const MARKOV_POOLS_3 = [
    { states: ["l'Opérateur Rouge", "l'Opérateur Bleu", "l'Opérateur Vert"], short: ["Rouge", "Bleu", "Vert"] },
    { states: ["la Banque Alpha", "la Banque Beta", "la Banque Gamma"], short: ["Alpha", "Beta", "Gamma"] },
    { states: ["la Marque X", "la Marque Y", "la Marque Z"], short: ["X", "Y", "Z"] }
  ];

  let mstate = { n: 2, pool: null, rows: [], solved: 0, streak: 0, solutionShown: false };

  function pctToStr(p){
    if (p === 0) return '0';
    if (p === 100) return '1';
    const s = (p / 100).toFixed(2);
    const trimmed = s.replace(/0$/, '').replace(/\.$/, '');
    return trimmed.replace('.', ',');
  }

  const markovFeedback = document.getElementById('markovFeedback');
  const markovStats = document.getElementById('markovStats');
  const checkMarkovBtn = document.getElementById('checkMarkovBtn');
  const solutionMarkovBtn = document.getElementById('solutionMarkovBtn');

  function buildMarkovRows(n){
    const rows = [];
    for (let i = 0; i < n; i++){
      const others = []; for (let j = 0; j < n; j++) if (j !== i) others.push(j);
      const row = new Array(n).fill(0);
      if (n === 2){
        const p = randInt(5, 45);
        row[others[0]] = p; row[i] = 100 - p;
      } else {
        const p1 = randInt(5, 40);
        const p2 = randInt(5, 60 - p1);
        row[others[0]] = p1; row[others[1]] = p2; row[i] = 100 - p1 - p2;
      }
      rows.push(row);
    }
    return rows;
  }

  function buildMarkovSentences(n, pool, rows){
    const sentences = [];
    for (let i = 0; i < n; i++){
      const others = []; for (let j = 0; j < n; j++) if (j !== i) others.push(j);
      const parts = others.map(j => rows[i][j] + '% passent chez ' + pool.states[j]);
      sentences.push('Les clients actuellement chez ' + pool.states[i] + ' : ' + parts.join(', ') + ', et le reste restent chez ' + pool.states[i] + '.');
    }
    return sentences;
  }

function(document){

const mat = (r, c, fn) => Array.from({ length: r }, (_, i) => Array.from({ length: c }, (_, j) => fn(i, j)));

// Gauss-Jordan on an n x (n+m) matrix; records every elementary operation

/* ---------- HTML snippets ---------- */
function mx(M, o = {}) {

const H = t => `<h4>${t}</h4>`;

function eqText(c, rhs, vars) {

/* ================= problem-part specs ================= */

/* ================= generators: matrices (BEC exercise 1) ================= */
function genMatricesBEC() {

/* ================= generators: operations ================= */
function genOps() {
  const A = mat(2, 3, () => R(-3, 5)), B = mat(2, 3, () => R(-3, 5)), C = mat(3, 2, () => R(-2, 4));

/* ================= generators: determinant & inverse 3x3 ================= */
function genInv3() {

      title: 'Determinant and inverse of a 3\u00d73 matrix',

      parts: [gridPart('a) det(<i>A</i>)', 'det(A) =', [[d]]), gridPart('b) <i>A</i><sup>\u22121</sup>', 'A\u207b\u00b9 =', inv)],
      solution: H('a) Determinant') + sarrusHTML(Af) + H('b) Inverse') + P_(`det(A) = ${fr(d)} \u2260 0, so A<sup>\u22121</sup> exists. Gauss\u2013Jordan on [A | I]:`) + stepsHTML(start, res, 3) + EQ(eqm('A<sup>\u22121</sup>', inv))

function parseNum(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/\u2212/g, '-').replace(/\s+/g, '').replace(',', '.');
  if (s === '') return null;
  let pct = false; if (s.endsWith('%')) { pct = true; s = s.slice(0, -1); }
  let v;
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split('/').map(Number); if (b === 0) return null; v = a / b; }
  else if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) v = Number(s);
  else return null;
  return isFinite(v) ? (pct ? v / 100 : v) : null;
}

function parseNum(raw) {
  if (raw == null) return null;
  let s = String(raw).trim().replace(/\u2212/g, '-').replace(/\s+/g, '').replace(',', '.');
  if (s === '') return null;
  let v;
  if (/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)) { const [a, b] = s.split('/').map(Number); if (b === 0) return null; v = a / b; }
  else if (/^-?(\d+\.?\d*|\.\d+)$/.test(s)) v = Number(s);
  else return null;
  return isFinite(v) ? v : null;
}

const tl = items => `<ul class="tlist">${items.map(([d, t]) => `<li><b>${d}</b> ${t}</li>`).join('')}</ul>`;
const headP = label => ({ kind: 'head', label });

/* ----- Exercises 2 and 4: wholesaler with returns ----- */
function wholesaler(o) {
  const buy = o.bq * o.c, ret = o.rq * o.c, sale = o.sq * o.p, cg = o.sq * o.c, pay = buy - ret, cr = o.cq * o.p, crc = o.cq * o.c, rec = sale - cr, ns = sale - cr, cogs = cg - crc, gp = ns - cogs, kept = o.sq - o.cq;
  const E = [
    ent(`<b>${o.d[0]}</b> ${o.me} buys ${o.bq} ${o.u} for $${o.c} each from ${o.sup} on account.`, [L('inv', 'D', buy), L('ap', 'C', buy)], `${LOGIC_PERP} L'achat à crédit augmente Inventory (débit) et la dette envers ${o.sup} : Accounts Payable (crédit).`, undefined, { math: `${o.bq} × $${o.c} = <b>$${fmt(buy)}</b>` }),
    ent(`<b>${o.d[1]}</b> They return ${o.rq} ${o.u} to ${o.sup} ${o.rwhy}.`, [L('ap', 'D', ret), L('inv', 'C', ret)], `Retour au fournisseur : on annule une partie de l'achat, au prix payé. La dette baisse (débit Accounts Payable) et le stock baisse (crédit Inventory).`, undefined, { math: `${o.rq} × $${o.c} = <b>$${fmt(ret)}</b>` }),
    ent(`<b>${o.d[2]}</b> ${o.me} sells ${o.sq} ${o.u} to ${o.cus} for $${o.p} each on account.`, [L('ar', 'D', sale), L('sales', 'C', sale), L('cogs', 'D', cg), L('inv', 'C', cg)], `Une vente en système permanent donne <b>deux</b> écritures : le produit au prix de vente (Accounts Receivable / Sales) ET la sortie de stock au coût (Cost of Goods Sold / Inventory).`, undefined, { math: `Vente : ${o.sq} × $${o.p} = <b>$${fmt(sale)}</b>. Coût : ${o.sq} × $${o.c} = <b>$${fmt(cg)}</b>.` }),
    ent(`<b>${o.d[3]}</b> ${o.me} pays ${o.sup}.`, [L('ap', 'D', pay), L('cash', 'C', pay)], `On règle ce qui reste dû après le retour (aucune condition d'escompte n'est indiquée) : la dette disparaît (débit), la trésorerie baisse (crédit).`, undefined, { math: `$${fmt(buy)} − $${fmt(ret)} = <b>$${fmt(pay)}</b>` }),
    ent(`<b>${o.d[4]}</b> ${o.cus} returns ${o.cq} ${o.u} ${o.cwhy}.`, [L('srets', 'D', cr), L('ar', 'C', cr), L('inv', 'D', crc), L('cogs', 'C', crc)], `Retour d'un client : deux écritures inverses de la vente. On annule le produit au <b>prix de vente</b> (Sales Returns and Allowances, compte correcteur des ventes, et baisse de la créance) ET on remet en stock au <b>coût</b> (Inventory / Cost of Goods Sold), car la marchandise est revendable.`, undefined, { math: `Prix : ${o.cq} × $${o.p} = <b>$${fmt(cr)}</b>. Coût : ${o.cq} × $${o.c} = <b>$${fmt(crc)}</b>.` }),
    ent(`<b>${o.d[5]}</b> ${o.me} receives payment from ${o.cus}. <i>(novembre)</i>`, [L('cash', 'D', rec), L('ar', 'C', rec)], `Le client règle ce qu'il doit encore : la vente moins le retour. Aucune écriture de produit : il a déjà été comptabilisé.`, undefined, { math: `$${fmt(sale)} − $${fmt(cr)} = <b>$${fmt(rec)}</b>` })
  ];
  return {
    statement: pp(`${o.me} is a wholesaler of ${o.what}.`) + tl(o.d.map((d, i) => [d, [`The company buys ${o.bq} ${o.u} for $${o.c} each from ${o.sup} on account.`, `They return ${o.rq} ${o.u} to ${o.sup} ${o.rwhy}.`, `${o.me} sells ${o.sq} ${o.u} to ${o.cus} for $${o.p} each on account.`, `${o.me} pays ${o.sup}.`, `${o.cus} returns ${o.cq} ${o.u} ${o.cwhy}.`, `${o.me} receives payment from ${o.cus}.`][i]])) + REQ([`Journalize the transactions of October for the company ${o.me}.`, `Compute the gross profit on the sales to ${o.cus}.`]),
    parts: E.concat([nums(`Gross profit on the sales to ${o.cus}`, [
      { lab: 'Net sales (sales − returns)', exp: ns, how: `$${fmt(sale)} − $${fmt(cr)} = $${fmt(ns)}` }, { lab: 'Cost of goods sold (net of the returned units)', exp: cogs, how: `$${fmt(cg)} − $${fmt(crc)} = $${fmt(cogs)}` }, { lab: 'Gross profit', exp: gp, how: `$${fmt(ns)} − $${fmt(cogs)} = $${fmt(gp)}. Contrôle : ${kept} ${o.u} conservés par le client × ($${o.p} − $${o.c}) = $${fmt(kept * (o.p - o.c))}.` }])]),
    sol: h4('Méthode') + pp("1) Fixe le prix d'achat unitaire (coût) et le prix de vente. 2) Chaque opération touche Inventory <b>au coût</b> ; chaque vente ou retour client touche aussi Sales / Sales Returns <b>au prix de vente</b>. 3) La marge brute se calcule sur les ventes <b>nettes</b> des retours, avec un coût également net.") + h4('Marge brute') + eqline(`Net sales = ${dl(sale)} ${MINUS} ${dl(cr)} = <b>${dl(ns)}</b>`) + eqline(`COGS = ${dl(cg)} ${MINUS} ${dl(crc)} = <b>${dl(cogs)}</b>`) + eqline(`Gross profit = ${dl(ns)} ${MINUS} ${dl(cogs)} = <b>${dl(gp)}</b>`)
  };
}

    ent('<b>May 15</b> MegoBlock collects the amount due.', [L('cash', 'D', TM.rest), L('ar', 'C', TM.rest)], `Aucune condition d'escompte n'est indiquée : le client paie exactement ce qu'il doit (vente − retour). Aucun produit nouveau.`, undefined, { math: `$${fmt(TM.sale)} − $${fmt(TM.ret)} = <b>$${fmt(TM.rest)}</b>` }),
    headP('<b>2. Toys and More (buyer)</b>'),

function discountEx(o) {
  const inv = o.n * o.u, net = cents(inv * 0.98), nu = cents(net / o.n), disc = cents(inv - net), sold = o.s * o.p;
  const cN = cents(o.s * nu), cG = o.s * o.u, discSold = cents(disc * o.s / o.n), discKept = cents(disc - discSold);
  const sd = ['Mar. 6', 'Mar. 11', 'Mar. 16'];
  const statementTxt = o.stmt;
  const N = [
    ent(`<b>${o.d[0]}</b> Purchase of ${o.n} televisions on account, $${o.u} per unit (invoice $${fmt(inv)}), terms 2/10, n/30. <i>(net cost)</i>`, [L('inv', 'D', net), L('ap', 'C', net)], `Coût net : on enregistre l'achat à 98 % de la facture, comme si l'escompte allait être pris. Le coût unitaire devient $${fmt(nu)}.`, undefined, { math: `$${fmt(inv)} × 0,98 = <b>$${fmt(net)}</b>. Par unité : $${fmt(net)} / ${o.n} = $${fmt(nu)}.` }),
    ent(`<b>${o.d[1]}</b> ${o.sellTxt} <i>(net cost)</i>`, [L('cash', 'D', sold), L('sales', 'C', sold), L('cogs', 'D', cN), L('inv', 'C', cN)], `Vente au comptant : produit au prix de vente, et sortie de stock au coût UNITAIRE NET ($${fmt(nu)}).`, undefined, { math: `Vente : ${o.s} × $${o.p} = <b>$${fmt(sold)}</b>. Coût : ${o.s} × $${fmt(nu)} = <b>$${fmt(cN)}</b>.` }),
    ent(`<b>${o.d[2]}</b> Payment within the discount period. <i>(net cost)</i>`, [L('ap', 'D', net), L('cash', 'C', net)], `La dette est déjà au montant net : on paie ce montant, sans autre écriture. L'escompte est « invisible » car intégré dès l'achat.`, undefined, { math: `<b>$${fmt(net)}</b>` })
  ];
  const G = [
    ent(`<b>${o.d[0]}</b> Purchase of ${o.n} televisions on account, invoice $${fmt(inv)}, terms 2/10, n/30. <i>(gross invoice price)</i>`, [L('inv', 'D', inv), L('ap', 'C', inv)], `Prix brut : on enregistre exactement la facture. Les escomptes seront pris en compte seulement au paiement.`, undefined, { math: `${o.n} × $${o.u} = <b>$${fmt(inv)}</b>` }),
    ent(`<b>${o.d[1]}</b> ${o.sellTxt} <i>(gross invoice price)</i>`, [L('cash', 'D', sold), L('sales', 'C', sold), L('cogs', 'D', cG), L('inv', 'C', cG)], `Vente au comptant : le coût de sortie est le coût BRUT $${fmt(o.u)} par unité (le stock est au prix de la facture).`, undefined, { math: `Vente : ${o.s} × $${o.p} = <b>$${fmt(sold)}</b>. Coût : ${o.s} × $${o.u} = <b>$${fmt(cG)}</b>.` }),
    ent(`<b>${o.d[2]}</b> Payment within the discount period. <i>(gross invoice price)</i>`, [L('ap', 'D', inv), L('cash', 'C', net), L('inv', 'C', discKept), L('cogs', 'C', discSold)], `On paie 98 % et la dette de $${fmt(inv)} disparaît. L'escompte de $${fmt(disc)} réduit le coût de TOUTES les unités achetées : la part des unités encore en stock réduit Inventory, la part des unités déjà vendues réduit Cost of Goods Sold. Après cette écriture, COGS et stock sont identiques à ceux de la méthode du coût net.`, undefined, { math: `Escompte = $${fmt(inv)} × 2 % = <b>$${fmt(disc)}</b>. Part vendue = ${o.s}/${o.n} × ${fmt(disc)} = <b>$${fmt(discSold)}</b>. Part en stock = <b>$${fmt(discKept)}</b>. Paiement = ${fmt(inv)} − ${fmt(disc)} = <b>$${fmt(net)}</b>.`, alts: [[L('ap', 'D', inv), L('cash', 'C', net), L('inv', 'C', disc)]] })
  ];
  const lateN = ent(`<b>${o.d[3]}</b> Payment of the full invoice price after the discount period. <i>(liability recorded at net cost)</i>`, [L('ap', 'D', net), L('pdl', 'D', disc), L('cash', 'C', inv)], `La dette était à $${fmt(net)} : l'escompte perdu de $${fmt(disc)} est une charge, Purchase Discounts Lost. On paie le prix complet.`, undefined, { math: `Escompte perdu = $${fmt(inv)} − $${fmt(net)} = <b>$${fmt(disc)}</b>. Paiement = <b>$${fmt(inv)}</b>.` });
  const lateG = ent(`<b>${o.d[3]}</b> Payment of the full invoice price after the discount period. <i>(liability recorded at gross invoice price)</i>`, [L('ap', 'D', inv), L('cash', 'C', inv)], `La dette était déjà au prix complet : on la solde simplement. Aucun escompte à constater, donc rien ne montre qu'on a raté une économie.`, undefined, { math: `<b>$${fmt(inv)}</b>` });
  const ann = cents(2 / 98 * 365 / 20 * 100);
  return {
    statement: pp(`${o.who} uses a perpetual inventory system. The following are three recent merchandising transactions:`) + tl(o.d.slice(0, 3).map((d, i) => [d, statementTxt[i]])) + REQ([`a. Prepare journal entries to record these transactions assuming that ${o.who2} records purchases of merchandise at: 1. Net cost 2. Gross invoice price`, `b. Assume that ${o.who2} did not pay ${o.sup} within the discount period but instead paid the full invoice price on ${o.d[3]}. Prepare journal entries to record this payment assuming that the original liability had been recorded at: 1. Net cost 2. Gross invoice price`, `c. Assume that you are evaluating the efficiency of ${o.who2}'s bill-paying procedures. Which accounting method — net cost or gross invoice price — provides you with the most useful information? Explain.`]),
    parts: [headP('<b>a.1</b> Purchases recorded at <b>net cost</b>')].concat(N, [headP('<b>a.2</b> Purchases recorded at <b>gross invoice price</b>')], G, [headP('<b>b.1</b> Late payment, liability recorded at net cost'), lateN, headP('<b>b.2</b> Late payment, liability recorded at gross invoice price'), lateG, headP('<b>c.</b> Which method is more useful to evaluate bill-paying efficiency?'),
      ynDrill('Choose the method.', ['Net cost method', 'Gross invoice price method'], [{ text: 'The method that gives the most useful information about the efficiency of bill-paying is…', exp: 0, why: 'Coût net : l\'escompte perdu apparaît dans un compte de charge distinct (Purchase Discounts Lost).' }]),
      openQ('Explain in one or two sentences (not graded).', `<b>Réponse type :</b> la méthode du <b>coût net</b> est la plus utile, car chaque escompte raté apparaît dans un compte visible, Purchase Discounts Lost. La direction voit tout de suite l'inefficacité de la procédure de paiement. Avec le prix brut, l'escompte perdu est noyé dans le coût du stock et du COGS : rien ne signale l'erreur. Renoncer à un escompte 2/10, n/30 revient à emprunter au taux annualisé ≈ 2/98 × 365/20 ≈ ${fmt(ann)} %.`)]),
    sol: h4('Logique') + pp("Les deux méthodes donnent le <b>même coût final</b> quand l'escompte est pris. Elles diffèrent quand il est perdu : au coût net, la perte est une charge séparée ; au prix brut, elle est cachée dans le coût des marchandises.") + h4('Calculs') + eqline(`Coût net unitaire = $${fmt(o.u)} × 0,98 = <b>$${fmt(nu)}</b> ; escompte total = <b>$${fmt(disc)}</b>`) +
      eqline(`Après la dernière écriture (escompte pris) : COGS = <b>$${fmt(cN)}</b>, stock restant = <b>$${fmt(cents((o.n - o.s) * nu))}</b>, dans les deux méthodes`) + pp(`<span class="soft">Variante acceptée (écriture au prix brut) : tout l'escompte de $${fmt(disc)} crédité à Inventory, sans l'éclater avec COGS.</span>`)
  };
}

const LAYT = rows => `<table class="jtab ev"><thead><tr><th></th><th>Quantity</th><th>Unit cost</th><th>Total cost</th></tr></thead><tbody>${rows.map(r => `<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td>$${fmt(r[2])}</td><td>$${fmt(r[1] * r[2])}</td></tr>`).join('')}<tr class="b"><td>Total</td><td>${fmt(rows.reduce((t, r) => t + r[1], 0))}</td><td></td><td>$${fmt(rows.reduce((t, r) => t + r[1] * r[2], 0))}</td></tr></tbody></table>`;
function flowCost(layers, units, how, spec) {
  const Ls = layers.map(l => ({ u: l[1], c: l[2] })), tu = Ls.reduce((t, l) => t + l.u, 0), tc = Ls.reduce((t, l) => t + l.u * l.c, 0); let cogs = 0;
  if (how === 'avg') cogs = units * tc / tu; else if (how === 'spec') spec.forEach(([i, n]) => { cogs += n * Ls[i].c; });
  else { let need = units; (how === 'fifo' ? Ls.map((_, i) => i) : Ls.map((_, i) => i).reverse()).forEach(i => { const t = Math.min(need, Ls[i].u); cogs += t * Ls[i].c; need -= t; }); }
  return { cogs: cr2(cogs), tu, tc, avg: tc / tu };
}
const FLOWWHY = { fifo: "FIFO (premier entré, premier sorti) : les premières unités achetées sont réputées vendues en premier. Le COGS reçoit les coûts les plus <b>anciens</b>, le stock final garde les coûts les plus <b>récents</b>.", lifo: "LIFO (dernier entré, premier sorti) : les unités les plus récentes (parmi celles déjà en stock à la date de la vente) sont vendues en premier. Le COGS reçoit les coûts les plus <b>récents</b>, le stock final garde les coûts les plus <b>anciens</b>.", avg: "Coût moyen (moyenne mobile en inventaire permanent) : coût unitaire = coût total des unités disponibles ÷ nombre d'unités disponibles <b>à la date de la vente</b>.", spec: "Identification spécifique : on suit le coût réel de chaque unité vendue, comme l'énoncé l'indique." };
const CHECK_AFS = pp('<span class="soft">Contrôle de cohérence : coût des marchandises disponibles = COGS + stock final, quelle que soit la méthode.</span>');

/* ================= TABLES + chapitres 1 à 4 ================= */
const nC = (exp, o) => Object.assign({ t: 'n', exp: Math.round(exp * 100) / 100, tol: 0.01 }, o || {});
const sC = (opts, exp) => ({ t: 's', opts, exp });
const tC = v => ({ t: 't', v });
const rowT = (lab, cells, o) => Object.assign({ lab, cells }, o || {});
const secT = lab => ({ lab, sec: true });
const tableP = (label, head, rows, o) => Object.assign({ kind: 'table', label, head, rows }, o || {});
const money = v => nC(v), pct = v => nC(v, { pct: true, fmt: 'pct', tol: 0.06 }), xr = v => nC(v, { fmt: 'x', tol: 0.011 });
const hw = (txt) => `<p class="soft">${txt}</p>`;
const jlist = entries => entries.map(e => `<div class="solent"><div class="solh">${e.label}</div>${jtable(e.lines)}</div>`).join('');

/* ---------- Ch1 : classer les comptes ---------- */
const TYP5 = ['Asset', 'Liability', "Owners' equity", 'Revenue', 'Expense'], STM3 = ['Balance sheet', 'Income statement', 'Statement of retained earnings'];
const CLS_POOL = [['Cash', 0, 0], ['Accounts Receivable', 0, 0], ['Supplies', 0, 0], ['Prepaid Insurance', 0, 0], ['Equipment', 0, 0], ['Inventory', 0, 0], ['Accounts Payable', 1, 0], ['Notes Payable', 1, 0], ['Unearned Revenue', 1, 0], ['Salaries Payable', 1, 0], ['Capital Stock', 2, 0], ['Dividends', 2, 2], ['Service Revenue', 3, 1], ['Interest Revenue', 3, 1], ['Sales', 3, 1], ['Rent Expense', 4, 1], ['Salaries Expense', 4, 1], ['Depreciation Expense', 4, 1], ['Cost of Goods Sold', 4, 1], ['Utilities Expense', 4, 1]];
const CLS_WHY = ['Actif : ce que l\'entreprise possède, au bilan.', 'Dette : ce que l\'entreprise doit, au bilan.', 'Capitaux propres : apports des propriétaires et bénéfices conservés.', 'Produit : il augmente le résultat, au compte de résultat.', 'Charge : elle diminue le résultat, au compte de résultat.'];
function genClassify() {
  const items = shuffle(CLS_POOL).slice(0, 8);
  return { title: 'Classify the accounts', statement: pp('For each account, identify the type of account and the financial statement on which it appears. (Dividends are not an expense: they appear in the statement of retained earnings.)'),
    parts: [tableP('Account classification', ['Type of account', 'Appears on'], items.map(i => rowT(i[0], [sC(TYP5, i[1]), sC(STM3, i[2])])), { first: 'Account', cw: 150 })],
    sol: h4('Logique') + items.map(i => eqline(`${i[0]} : <b>${TYP5[i[1]]}</b>, ${STM3[i[2]]}. <span class="soft">${CLS_WHY[i[1]]}</span>`)).join('') + pp('Les trois états : compte de résultat (produits − charges = résultat net), état des bénéfices non distribués (solde d\'ouverture + résultat net − dividendes), bilan (actif = dettes + capitaux propres).') };
}
/* ---------- Ch1 : effet des opérations sur l'équation comptable ---------- */
function genTxEq() {
  const T = [
    () => { const m = A(5000, 40000, 1000); return { t: `The owner invests $${fmt(m)} cash in exchange for capital stock.`, a: m, l: 0, e: m, w: `Cash ↑ et capital ↑ : actif et capitaux propres augmentent.` }; },
    () => { const m = A(2000, 12000, 500); return { t: `The company buys equipment for $${fmt(m)} on account.`, a: m, l: m, e: 0, w: `Équipement ↑ (actif) et dette fournisseur ↑ (passif).` }; },
    () => { const m = A(1000, 9000, 500); return { t: `The company buys equipment for $${fmt(m)} and pays cash.`, a: 0, l: 0, e: 0, w: `Un actif remplace un autre : le total de l'actif ne change pas.` }; },
    () => { const m = A(3000, 20000, 1000); return { t: `The company borrows $${fmt(m)} from the bank (note payable).`, a: m, l: m, e: 0, w: `Cash ↑ (actif) et Notes Payable ↑ (passif).` }; },
    () => { const m = A(1500, 9000, 500); return { t: `The company performs services on account for $${fmt(m)}.`, a: m, l: 0, e: m, w: `Accounts Receivable ↑ et produit ↑ : les capitaux propres augmentent via le résultat.` }; },
    () => { const m = A(500, 4000, 100); return { t: `The company pays $${fmt(m)} cash for rent expense.`, a: -m, l: 0, e: -m, w: `Cash ↓ et charge ↑ : les capitaux propres baissent.` }; },
    () => { const m = A(500, 5000, 100); return { t: `The company pays $${fmt(m)} cash to settle an account payable.`, a: -m, l: -m, e: 0, w: `L'actif et le passif baissent du même montant.` }; },
    () => { const m = A(500, 5000, 100); return { t: `The company collects $${fmt(m)} from a customer on account.`, a: 0, l: 0, e: 0, w: `Cash ↑ et créance ↓ : le total de l'actif ne change pas.` }; },
    () => { const m = A(500, 3000, 100); return { t: `The company pays $${fmt(m)} cash dividends.`, a: -m, l: 0, e: -m, w: `Cash ↓ et bénéfices non distribués ↓.` }; },
    () => { const m = A(200, 900, 50); return { t: `The company receives a $${fmt(m)} utility bill, to be paid next month.`, a: 0, l: m, e: -m, w: `Dette ↑ et charge ↑ : passif ↑, capitaux propres ↓.` }; },
    () => { const m = A(800, 6000, 100); return { t: `A customer pays $${fmt(m)} cash in advance for services to be performed next month.`, a: m, l: m, e: 0, w: `Cash ↑ et Unearned Revenue ↑ (dette) : pas encore de produit.` }; }
  ];
  const picks = shuffle(T).slice(0, 5).map(f => f());
  return { title: 'Effects on the accounting equation', statement: pp('For each transaction, give the change in total assets, total liabilities and owners\' equity (positive for an increase, negative for a decrease, 0 for no change).'),
    parts: [tableP('Changes in A = L + OE', ['Δ Assets', 'Δ Liabilities', "Δ Owners' equity"], picks.map(x => rowT(x.t, [money(x.a), money(x.l), money(x.e)])), { first: 'Transaction', cw: 96 })],
    sol: h4('Logique') + pp('Après chaque opération, <b>Actif = Passif + Capitaux propres</b> reste vrai : ΔA = ΔL + ΔCP.') + picks.map(x => eqline(`${x.t}<br><span class="soft">${x.w} ΔA = ${x.a}, ΔL = ${x.l}, ΔCP = ${x.e}.</span>`)).join('') };
}
/* ---------- Ch2 : analyse d'une opération (4 sections) ---------- */
const EFF4 = ['Increase (debit)', 'Increase (credit)', 'Decrease (debit)', 'Decrease (credit)'];
const effIdx = l => { const inc = l.s === ACC[l.a][1]; return inc ? (l.s === 'D' ? 0 : 1) : (l.s === 'D' ? 2 : 3); };
function genAnalysis() {
  const base = genTrans({ invest: true, n: 5 }); const ents = base.parts.filter(p => p.kind === 'entry').slice(0, 4); const rows = [];
  ents.forEach(e => { rows.push(secT(e.label)); e.lines.forEach(l => rows.push(rowT(nm(l.a), [sC(EFF4, effIdx(l))]))); });
  return { title: 'Transaction analysis: debit and credit rules', statement: pp('For each transaction, analyze each account: does it increase or decrease, and is it recorded with a debit or a credit? Remember: assets, expenses and dividends increase with a debit; liabilities, equity and revenues increase with a credit.'),
    parts: [tableP('Analysis', ['Effect on the account'], rows, { first: 'Account', cw: 170 })],
    sol: h4('Logique') + ents.map(e => `<div class="solent"><div class="solh">${e.label}</div>${jtable(e.lines)}<p class="why"><span class="lg">Logique</span>${e.why}</p></div>`).join('') };
}
/* ---------- Ch2 : report aux T-accounts ---------- */
function genTAcc() {
  const base = genTrans({ trial: true, invest: true }); const ents = base.parts.filter(p => p.kind === 'entry'); const bal = ledger(ents), keys = ACC_KEYS.filter(k => ents.some(e => e.lines.some(l => l.a === k)));

      sol: h4('Logique') + pp('<b>Feuille de travail</b> : un seul tableau qui enchaîne balance non ajustée → ajustements → balance ajustée → colonnes du compte de résultat → colonnes du bilan. Produits et charges vont au compte de résultat ; actifs, passifs et capitaux propres au bilan.') + eqline('Solde ajusté = solde non ajusté ± ajustements') + eqline('Résultat net = total des produits − total des charges (colonnes du compte de résultat)') + eqline('Après report du résultat net : total des débits = total des crédits dans chaque paire de colonnes') + adjs.map(a => `<div class="solent">${a[0]}${jtable(a[1])}</div>`).join(''), ws: { NI, isD, isC, bsD, bsC, adjD, adjC, bal } };

function genInvCard() {

      sol: h4('Logique') + pp(FLOWWHY.fifo) + pp(FLOWWHY.lifo) + pp(FLOWWHY.avg) + h4('Formules') + eqline('COGS = Σ (unités × coût de chaque couche utilisée)') + eqline('Marge brute = ventes − COGS') + eqline('Stock final = coût des marchandises disponibles − COGS') };

function genDepSchedule() {
  const C = A(10, 50, 5) * 1000, S = A(1, 5, 1) * 500, n = 5, sl = (C - S) / n, rows = []; let bv = C, acc = 0, cumSL = 0, bvD = C, accD = 0;

  if (remember) { try { localStorage.setItem('rev-midterms-tab', name); } catch (e) {} }
}
tabs.forEach(t => t.addEventListener('click', () => { show(t.dataset.app, true); window.scrollTo(0, 0); }));
let start = 'matrices'; try { const s = localStorage.getItem('rev-midterms-tab'); if (s && APPS[s]) start = s; } catch (e) {}
show(start, false);
(function countdown(){
  const today = new Date(); today.setHours(0, 0, 0, 0);
  document.querySelectorAll('.exams span').forEach(sp => {
    const [y, m, d] = sp.dataset.date.split('-').map(Number), diff = Math.round((new Date(y, m - 1, d) - today) / 864e5);
    sp.querySelector('i').textContent = diff > 1 ? 'J\u2212' + diff : diff === 1 ? 'demain' : diff === 0 ? "aujourd\u2019hui" : 'passé';
  });
})();

</script>
